<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IONSTAY Staff App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (JSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* カスタムスクロールバー非表示設定 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* アニメーション定義 */
    @keyframes popInDate {
      0% { opacity: 0; transform: scale(0.5) translateY(15px) rotate(-10deg); }
      60% { transform: scale(1.1) translateY(-2px) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
    }
    .animate-pop-date {
      animation: popInDate 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes scaleCheck {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-check-icon {
      animation: scaleCheck 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    /* iOSセーフエリア対応（iPhoneのノッチ等の対応） */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-slate-900">
  <div id="root"></div>

  <!-- Firebaseモジュールの読み込み設定 -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"
      }
    }
  </script>

  <!-- FirebaseモジュールをBabelスクリプトで使えるようにグローバルに渡す -->
  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "firebase/auth";
    window.FirebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously };
  </script>

  <!-- メインのReactアプリケーションコード -->
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { initializeApp, getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } = window.FirebaseModules;

    // --- Firebase設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyB0-mHJb9yM0MhemGTt92WMQ202TbvSuQg",
      authDomain: "project-2995067381131776203.firebaseapp.com",
      projectId: "project-2995067381131776203",
      storageBucket: "project-2995067381131776203.firebasestorage.app",
      messagingSenderId: "593187187502",
      appId: "1:593187187502:web:09b0b60744136c730ce8bf"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // --- アイコンコンポーネント (Lucide IconsのSVGを手動定義) ---
    const Check = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const ClipboardList = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
    const BookOpen = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    const MapPin = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    const Sparkles = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
    const ChevronRight = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
    const CheckCircle2 = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
    const LogOut = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;
    const UserIcon = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Lock = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const Mail = ({ className, strokeWidth = 2 }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;

    // --- モックデータ ---
    const FACILITIES = [
      { id: 'tenjin', name: '天神' },
      { id: 'hakata', name: '博多' },
      { id: 'kiyokawa', name: '清川' },
    ];

    const CLEANING_TYPES = [
      { id: 'regular', name: '通常清掃' },
      { id: 'md', name: 'MD (特別清掃)' },
    ];

    const CHECK_ITEMS = {
      regular: [
        { id: 'r1', label: '換気扇を回す・窓を開けて換気' },
        { id: 'r2', label: 'ゴミ回収・分別確認' },
        { id: 'r3', label: 'ベッドメイク（シーツ・枕カバー交換）' },
        { id: 'r4', label: 'トイレの壁拭き・便器清掃' },
        { id: 'r5', label: 'お風呂場の清掃・水滴完全拭き取り' },
        { id: 'r6', label: '洗面台の清掃・鏡の拭き上げ' },
        { id: 'r7', label: 'ドライヤーフィルター清掃' },
        { id: 'r8', label: '床の掃除機掛け・モップ掛け' },
        { id: 'r9', label: '消耗品（ペーパー類・アメニティ）補充' },
        { id: 'r10', label: '最終確認（忘れ物チェック、消灯、施錠）' },
      ],
      md: [
        { id: 'm1', label: '【MD】エアコンフィルターの取り外し洗浄' },
        { id: 'm2', label: '【MD】換気扇カバーの分解洗浄' },
        { id: 'm3', label: '【MD】洗濯機パン・排水溝の徹底清掃' },
        { id: 'm4', label: '【MD】窓ガラス・サッシ・レールの拭き掃除' },
        { id: 'm5', label: '【MD】マットレスの裏返し・ベッド下の掃除' },
        { id: 'm6', label: '【MD】冷蔵庫内・電子レンジのアルコール除菌' },
        { id: 'm7', label: '【MD】トイレの壁・床の徹底拭き（専用洗剤使用）' },
        { id: 'm8', label: '【MD】ドライヤーフィルター清掃・本体除菌' },
        { id: 'm9', label: '【MD】ラグ・カーペットのシミ抜き・念入り掃除機' },
      ]
    };

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState('tasks');
      const [activeFacility, setActiveFacility] = useState('tenjin');
      const [activeType, setActiveType] = useState('regular');
      
      const [checkStates, setCheckStates] = useState({});
      const [showComplete, setShowComplete] = useState(false);

      const getTodayString = () => {
        const today = new Date();
        return `${today.getMonth() + 1}/${today.getDate()}`;
      };

      const handleToggle = (itemId) => {
        const key = `${activeFacility}-${activeType}-${itemId}`;
        setCheckStates(prev => {
          const newState = { ...prev };
          if (newState[key]) {
            delete newState[key];
          } else {
            newState[key] = getTodayString();
          }
          return newState;
        });
      };

      const currentItems = CHECK_ITEMS[activeType];
      const completedCount = currentItems.filter(item => checkStates[`${activeFacility}-${activeType}-${item.id}`]).length;
      const progress = currentItems.length > 0 ? (completedCount / currentItems.length) * 100 : 0;

      useEffect(() => {
        if (completedCount === currentItems.length && currentItems.length > 0) {
          setShowComplete(true);
          const timer = setTimeout(() => setShowComplete(false), 2500);
          return () => clearTimeout(timer);
        }
      }, [completedCount, currentItems.length]);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (authLoading) {
        return (
          <div className="max-w-md mx-auto h-screen flex flex-col items-center justify-center bg-slate-50">
            <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p className="mt-4 text-slate-500 font-bold">読み込み中...</p>
          </div>
        );
      }

      if (!user) {
        return <LoginView auth={auth} />;
      }

      const displayName = user.email ? user.email.split('@')[0] : 'Guest Staff';

      return (
        <div className="max-w-md mx-auto h-screen flex flex-col bg-slate-50 font-sans relative overflow-hidden shadow-2xl">
          <header className="bg-white border-b border-slate-200 px-5 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
              <h1 className="text-2xl font-black tracking-tight text-slate-800">IONSTAY</h1>
              <p className="text-xs font-semibold text-slate-400">STAFF APP</p>
            </div>
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1.5 text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full shadow-sm">
                <UserIcon className="w-3.5 h-3.5" />
                <span className="max-w-[80px] truncate">{displayName}</span>
              </div>
              <button 
                onClick={() => signOut(auth)}
                className="w-10 h-10 bg-slate-50 hover:bg-slate-100 rounded-full flex items-center justify-center transition-colors shadow-sm border border-slate-200 active:scale-95"
                title="ログアウト"
              >
                <LogOut className="w-4 h-4 text-slate-600 ml-0.5" />
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto hide-scrollbar">
            {activeTab === 'tasks' ? (
              <div className="p-5 pb-28">
                <div className="flex bg-slate-200 p-1 rounded-xl mb-6 shadow-inner">
                  {FACILITIES.map(facility => (
                    <button
                      key={facility.id}
                      onClick={() => setActiveFacility(facility.id)}
                      className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all duration-200 flex items-center justify-center gap-1 ${
                        activeFacility === facility.id 
                          ? 'bg-white text-blue-600 shadow-sm transform scale-100' 
                          : 'text-slate-500 hover:text-slate-700 active:scale-95'
                      }`}
                    >
                      <MapPin className="w-4 h-4" />
                      {facility.name}
                    </button>
                  ))}
                </div>

                <div className="flex gap-3 mb-6">
                  {CLEANING_TYPES.map(type => (
                    <button
                      key={type.id}
                      onClick={() => setActiveType(type.id)}
                      className={`flex-1 py-3 px-4 rounded-2xl font-bold text-sm transition-all duration-300 border-2 active:scale-95 flex flex-col items-center gap-1 ${
                        activeType === type.id
                          ? 'border-blue-600 bg-blue-50 text-blue-700'
                          : 'border-transparent bg-white text-slate-500 shadow-sm hover:bg-slate-50'
                      }`}
                    >
                      {type.name}
                      <span className={`w-8 h-1 rounded-full mt-1 ${activeType === type.id ? 'bg-blue-600' : 'bg-transparent'}`}></span>
                    </button>
                  ))}
                </div>

                <div className="mb-6 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                  <div className="flex justify-between items-end mb-3">
                    <div>
                      <h3 className="text-sm font-bold text-slate-400 mb-1">現在の進捗</h3>
                      <p className="text-3xl font-black text-slate-800 leading-none">
                        {completedCount} <span className="text-xl text-slate-300 font-semibold">/ {currentItems.length}</span>
                      </p>
                    </div>
                    <span className="text-sm font-black text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-100">
                      {Math.round(progress)}%
                    </span>
                  </div>
                  <div className="h-4 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div 
                      className="h-full bg-emerald-500 rounded-full transition-all duration-700 ease-out"
                      style={{ width: `${progress}%` }}
                    />
                  </div>
                </div>

                <div className="space-y-3">
                  {currentItems.map(item => {
                    const key = `${activeFacility}-${activeType}-${item.id}`;
                    const isChecked = !!checkStates[key];
                    const dateStr = checkStates[key];

                    return (
                      <div 
                        key={item.id}
                        onClick={() => handleToggle(item.id)}
                        className={`group relative flex items-center justify-between p-4 rounded-2xl border-2 transition-all duration-300 cursor-pointer select-none overflow-hidden ${
                          isChecked 
                            ? 'border-emerald-500 bg-emerald-50/50 shadow-sm' 
                            : 'border-slate-200 bg-white shadow-sm hover:border-blue-300 active:scale-[0.98]'
                        }`}
                      >
                        {isChecked && (
                          <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-100/30 rounded-full blur-2xl -mr-10 -mt-10"></div>
                        )}

                        <span className={`text-[15px] font-bold z-10 leading-snug pr-4 transition-all duration-300 ${
                          isChecked ? 'text-slate-400 line-through' : 'text-slate-700'
                        }`}>
                          {item.label}
                        </span>
                        
                        <div className="flex items-center gap-3 z-10 shrink-0">
                          {isChecked && (
                            <div className="flex flex-col items-end animate-pop-date">
                              <span className="text-[10px] font-black text-emerald-600/70 uppercase tracking-wider">DONE</span>
                              <span className="text-sm font-black text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-md">
                                {dateStr}
                              </span>
                            </div>
                          )}
                          <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all duration-300 relative ${
                            isChecked ? 'bg-emerald-500 border-emerald-500 shadow-md shadow-emerald-200' : 'border-slate-300 bg-slate-50'
                          }`}>
                            {isChecked && <Check className="w-5 h-5 text-white animate-check-icon absolute" strokeWidth={3} />}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ) : (
              <ManualView />
            )}
          </main>

          {showComplete && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-white/90 backdrop-blur-sm">
              <div className="text-center animate-pop-date">
                <div className="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <CheckCircle2 className="w-16 h-16 text-emerald-500" strokeWidth={2.5} />
                </div>
                <h2 className="text-3xl font-black text-slate-800 mb-2">完了！</h2>
                <p className="text-slate-500 font-bold">お疲れ様でした！</p>
              </div>
            </div>
          )}

          <nav className="bg-white border-t border-slate-200 pb-safe pt-2 px-6 pb-6 absolute bottom-0 w-full z-20">
            <div className="flex justify-around items-center pt-2">
              <button 
                onClick={() => setActiveTab('tasks')}
                className={`flex flex-col items-center p-2 transition-colors duration-200 ${
                  activeTab === 'tasks' ? 'text-blue-600' : 'text-slate-400'
                }`}
              >
                <div className={`p-2 rounded-2xl mb-1 transition-all ${activeTab === 'tasks' ? 'bg-blue-50' : ''}`}>
                  <ClipboardList className="w-6 h-6" strokeWidth={activeTab === 'tasks' ? 2.5 : 2} />
                </div>
                <span className="text-[10px] font-black tracking-wide">清掃タスク</span>
              </button>
              
              <button 
                onClick={() => setActiveTab('manual')}
                className={`flex flex-col items-center p-2 transition-colors duration-200 ${
                  activeTab === 'manual' ? 'text-blue-600' : 'text-slate-400'
                }`}
              >
                <div className={`p-2 rounded-2xl mb-1 transition-all ${activeTab === 'manual' ? 'bg-blue-50' : ''}`}>
                  <BookOpen className="w-6 h-6" strokeWidth={activeTab === 'manual' ? 2.5 : 2} />
                </div>
                <span className="text-[10px] font-black tracking-wide">マニュアル</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const ManualView = () => {
      return (
        <div className="p-5 pb-28 space-y-5 animate-in fade-in slide-in-from-bottom-4 duration-300">
          <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-3xl text-white shadow-lg mb-6">
            <h2 className="text-2xl font-black mb-2 flex items-center gap-2">
              <BookOpen className="w-6 h-6"/>
              STAFF MANUAL
            </h2>
            <p className="text-blue-100 text-sm font-medium opacity-90">
              IONSTAY クオリティを保つための清掃基準と対応マニュアルです。
            </p>
          </div>

          <div className="space-y-4">
            <ManualCard 
              title="🧹 清掃の基本理念" 
              content="お客様が「自分の家以上に快適」と感じる空間作りがIONSTAYの目標です。特に水回りの水滴一つ残さない拭き上げを徹底してください。" 
            />
            <ManualCard 
              title="✨ MD（特別清掃）とは？" 
              content="月に1回程度、空室のタイミングで行う徹底清掃です。通常清掃では手の届かないフィルター類や、家具の裏側などを清掃し、施設をリセットします。" 
            />
            <ManualCard 
              title="📱 忘れ物・破損の発見時" 
              content="清掃開始時に室内全体を確認し、忘れ物や備品の破損があった場合は【写真撮影】【部屋番号】【日付】をセットにして、速やかに本部のLINEグループへ報告してください。" 
            />
            <ManualCard 
              title="🗑 ゴミの分別ルール（福岡市）" 
              content="燃えるゴミ、燃えないゴミ、ビン・カン・ペットボトルを厳密に分別してください。指定袋以外のゴミ袋は回収されませんので注意してください。" 
            />
          </div>
        </div>
      );
    };

    const ManualCard = ({ title, content }) => {
      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm active:bg-slate-50 transition-colors">
          <h3 className="font-black text-slate-800 text-lg mb-2 flex items-center justify-between">
            {title}
            <ChevronRight className="w-5 h-5 text-slate-300" />
          </h3>
          <p className="text-sm text-slate-600 leading-relaxed font-medium">
            {content}
          </p>
        </div>
      );
    };

    const LoginView = ({ auth }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          console.error(err);
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
            setError('メールアドレスまたはパスワードが間違っているか、登録されていません。');
          } else {
            setError('ログインに失敗しました。もう一度お試しください。');
          }
        } finally {
          setLoading(false);
        }
      };

      const handleGuestLogin = async () => {
        setError('');
        setLoading(true);
        try {
          await signInAnonymously(auth);
        } catch (err) {
          console.error(err);
          setError('ゲストログインに失敗しました。FirebaseのAuthenticationで「匿名」を有効にしてください。');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto h-screen flex flex-col bg-slate-50 font-sans relative overflow-hidden shadow-2xl">
          <div className="flex-1 flex flex-col justify-center px-8 pb-20">
            <div className="mb-10 text-center">
              <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-200 rotate-3">
                <Sparkles className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-4xl font-black tracking-tight text-slate-800 mb-2">
                IONSTAY
              </h1>
              <p className="font-bold text-slate-500">STAFF LOGIN</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              {error && (
                <div className="p-3 bg-red-50 text-red-600 text-sm font-bold rounded-xl border border-red-100 text-center leading-relaxed">
                  {error}
                </div>
              )}
              
              <div className="space-y-1">
                <label className="text-xs font-bold text-slate-500 ml-1">メールアドレス</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <Mail className="h-5 w-5 text-slate-400" />
                  </div>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="block w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl text-slate-800 font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
                    placeholder="staff@ionstay.com"
                    required
                  />
                </div>
              </div>

              <div className="space-y-1">
                <label className="text-xs font-bold text-slate-500 ml-1">パスワード</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <Lock className="h-5 w-5 text-slate-400" />
                  </div>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="block w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl text-slate-800 font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className={`w-full mt-6 bg-blue-600 text-white font-black text-lg py-4 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-[0.98] transition-all flex items-center justify-center ${loading ? 'opacity-70' : ''}`}
              >
                {loading ? (
                  <div className="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                ) : (
                  'ログイン'
                )}
              </button>
            </form>

            <div className="mt-8 relative">
              <div className="absolute inset-0 flex items-center">
                <div className="w-full border-t border-slate-200"></div>
              </div>
              <div className="relative flex justify-center text-sm">
                <span className="px-2 bg-slate-50 text-slate-400 font-bold">プレビュー用</span>
              </div>
            </div>

            <button
              onClick={handleGuestLogin}
              disabled={loading}
              type="button"
              className="w-full mt-6 bg-white border-2 border-slate-200 text-slate-600 font-bold text-md py-3.5 rounded-2xl hover:bg-slate-100 active:scale-[0.98] transition-all"
            >
              テストスタッフとしてログイン
            </button>
          </div>
        </div>
      );
    };

    // Reactアプリのレンダリング
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
